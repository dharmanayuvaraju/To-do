name: maa_madhuram
description: "Do It Now - A loving, personal medicine reminder app crafted with care."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_local_notifications: ^17.2.3
  timezone: ^0.9.4
  flutter_timezone: ^3.0.1
  shared_preferences: ^2.3.2
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.0
  intl: ^0.19.0
  audioplayers: ^6.1.0
  vibration: ^2.0.1
  share_plus: ^10.1.1
  permission_handler: ^11.3.1
  firebase_core: ^3.8.1
  firebase_messaging: ^15.1.6
  firebase_database: ^11.1.6
  firebase_auth: ^5.3.4
  http: ^1.2.2
  googleapis_auth: ^1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/quotes.json
    - assets/audio/
    - assets/fonts/

  fonts:
    - family: Noto Sans Telugu
      fonts:
        - asset: assets/fonts/NotoSansTelugu-Regular.ttf
    - family: Ramabhadra
      fonts:
        - asset: assets/fonts/Ramabhadra-Regular.ttf
