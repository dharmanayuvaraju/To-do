name: Build Do It Now Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Setup google-services.json
        run: |
          if [ -n "${{ secrets.GOOGLE_SERVICES_JSON }}" ]; then
            echo "${{ secrets.GOOGLE_SERVICES_JSON }}" > android/app/google-services.json
          elif [ ! -f android/app/google-services.json ]; then
            echo '{"project_info":{"project_number":"123456789012","project_id":"do-it-now-a3y","storage_bucket":"do-it-now-a3y.appspot.com"},"client":[{"client_info":{"mobilesdk_app_id":"1:123456789012:android:abcdef0123456789","android_client_info":{"package_name":"com.a3y.doitnow"}},"oauth_client":[],"api_key":[{"current_key":"AIzaSyFakeKeyForDoItNowBuildVerification123"}],"services":{"appinvite_service":{"other_platform_oauth_client":[]}}}],"configuration_version":"1"}' > android/app/google-services.json
          fi

      - name: Generate release keystore if missing
        run: |
          if [ ! -f android/app/release-keystore.jks ]; then
            keytool -genkey -v -keystore android/app/release-keystore.jks -keyalg RSA -keysize 2048 -validity 10000 -alias doitnow -storepass doitnowkey123 -keypass doitnowkey123 -dname "CN=DoItNow, OU=Babu, O=DoItNow, L=City, S=State, C=IN"
          fi

      - name: Get dependencies
        run: flutter pub get

      - name: Code Analysis
        run: flutter analyze

      - name: Build Release APKs
        run: |
          set -o pipefail
          flutter build apk --release --split-per-abi --no-tree-shake-icons --android-skip-build-dependency-validation -v 2>&1 | tee build_log.txt

      - name: Log Failure Diagnostics
        if: failure()
        run: |
          echo "=== LAST 500 LINES OF BUILD LOG ==="
          tail -n 500 build_log.txt || true
          git config --global user.email "bot@doitnow.app"
          git config --global user.name "Build Bot"
          git checkout -B build-log-debug
          git add build_log.txt
          git commit -m "Capture build failure log" || true
          git push -f origin build-log-debug || true

      - name: Upload Build Log Artifact on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-failure-log
          path: build_log.txt

      - name: Upload Release APKs
        uses: actions/upload-artifact@v4
        with:
          name: Do-It-Now-Release-APKs
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
